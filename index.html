<!DOCTYPE html>
<html>
<head>
    <title>Мессенджер</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .screen { display: none; flex-direction: column; height: 100vh; }
        .screen.active { display: flex; }

        #login-screen {
            justify-content: center; align-items: center; background: #0084ff;
        }
        #login-screen .box {
            background: white; padding: 30px; border-radius: 15px;
            text-align: center; width: 85%; max-width: 350px;
        }
        #login-screen h1 { margin-bottom: 20px; color: #333; }
        #login-screen input {
            width: 100%; padding: 12px; margin: 8px 0;
            border: 1px solid #ddd; border-radius: 10px; font-size: 16px;
        }
        #login-screen button {
            width: 100%; padding: 12px; margin-top: 10px;
            background: #0084ff; color: white; border: none;
            border-radius: 10px; font-size: 18px; font-weight: bold;
        }

        .header {
            background: #0084ff; color: white; padding: 15px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header button {
            background: rgba(255,255,255,0.2); color: white; border: none;
            padding: 8px 15px; border-radius: 20px; font-size: 14px;
        }

        #chats-list { flex: 1; overflow-y: auto; padding: 10px; }
        .chat-item {
            background: white; padding: 15px; border-radius: 10px;
            margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
        }
        .chat-item .icon { font-size: 30px; }
        .chat-item .name { font-weight: bold; }

        #chat-actions {
            display: flex; padding: 10px; background: #fff;
            border-top: 1px solid #ddd; gap: 10px;
        }
        #chat-actions input {
            flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-size: 14px;
        }
        #chat-actions button {
            padding: 12px 15px; background: #0084ff; color: white;
            border: none; border-radius: 10px; font-weight: bold; font-size: 13px;
        }

        #profile-screen .content {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; padding: 30px;
        }
        #avatar-img {
            width: 100px; height: 100px; border-radius: 50%;
            object-fit: cover; background: #ddd; margin-bottom: 15px;
        }
        #profile-screen input[type="text"] {
            padding: 10px; font-size: 16px; margin: 10px 0;
            border: 1px solid #ddd; border-radius: 10px; width: 80%;
        }
        #profile-screen button {
            padding: 10px 20px; background: #0084ff; color: white;
            border: none; border-radius: 10px; margin: 5px;
        }
        #avatar-file { display: none; }

        #messages { flex: 1; padding: 10px; overflow-y: auto; }
        .message {
            background: #0084ff; color: white; padding: 10px 15px;
            border-radius: 20px; margin: 5px 0; max-width: 70%;
            word-wrap: break-word;
        }
        .message .sender { font-size: 11px; opacity: 0.7; margin-bottom: 3px; }
        .message-row { display: flex; gap: 8px; align-items: flex-end; margin: 5px 0; }
        .message-row .msg-avatar {
            width: 25px; height: 25px; border-radius: 50%; object-fit: cover; background: #ddd;
        }
        .input-area {
            display: flex; padding: 10px; background: #fff;
            border-top: 1px solid #ddd; gap: 10px;
        }
        .input-area input {
            flex: 1; padding: 12px 15px; font-size: 16px;
            border: 1px solid #ddd; border-radius: 25px; outline: none;
        }
        .input-area button {
            padding: 12px 25px; font-size: 16px; background: #0084ff;
            color: white; border: none; border-radius: 25px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="login-screen" class="screen active">
        <div class="box">
            <h1>🔐 Вход</h1>
            <input type="text" id="login-nick" placeholder="Придумай никнейм">
            <input type="password" id="login-pass" placeholder="Придумай пароль">
            <button onclick="login()">Войти</button>
        </div>
    </div>

    <div id="chats-screen" class="screen">
        <div class="header">
            <span>💬 Мессенджер</span>
            <button onclick="showScreen('profile-screen')">Профиль</button>
        </div>
        <div id="chats-list">Загрузка...</div>
        <div id="chat-actions">
            <input type="text" id="new-chat-name" placeholder="Название чата...">
            <button onclick="joinChat()">Войти</button>
        </div>
    </div>

    <div id="chat-room-screen" class="screen">
        <div class="header">
            <button onclick="showScreen('chats-screen')">← Назад</button>
            <span id="chat-room-title">Чат</span>
            <span></span>
        </div>
        <div id="messages"></div>
        <div class="input-area">
            <input type="text" id="msg-input" placeholder="Сообщение...">
            <button id="send-btn">Отправить</button>
        </div>
    </div>

    <div id="profile-screen" class="screen">
        <div class="header">
            <button onclick="showScreen('chats-screen')">← Назад</button>
            <span>Профиль</span>
            <button onclick="logout()">Выйти</button>
        </div>
        <div class="content">
            <img id="avatar-img" src="" alt="Аватар" onclick="document.getElementById('avatar-file').click()">
            <input type="file" id="avatar-file" accept="image/*" onchange="uploadAvatar()">
            <p style="font-size:12px;color:#888;">Нажми на аватар чтобы сменить</p>
            <p id="profile-nick" style="font-weight:bold;font-size:18px;"></p>
            <input type="text" id="new-nick" placeholder="Новый никнейм">
            <button onclick="updateProfile()">Сохранить ник</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyB4mdYi6d5_yWMeqf9SwRDuqMpLW7vseR8",
            authDomain: "website-9442c.firebaseapp.com",
            projectId: "website-9442c",
            storageBucket: "website-9442c.firebasestorage.app",
            messagingSenderId: "490236144166",
            appId: "1:490236144166:web:2651f3bc8a0a719e85d4e7",
            measurementId: "G-B2WHYMXE8K"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentUser = null;
        let currentChatId = null;

        // ВОССТАНОВЛЕНИЕ ВХОДА
        let savedUser = localStorage.getItem('currentUser');
        if (savedUser) {
            currentUser = JSON.parse(savedUser);
            showScreen('chats-screen');
        }

        window.showScreen = function(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (id === 'chats-screen') loadChats();
            if (id === 'profile-screen') loadProfile();
        };

        window.login = function() {
            let nick = document.getElementById('login-nick').value.trim();
            let pass = document.getElementById('login-pass').value.trim();
            if (!nick || !pass) { alert('Заполни оба поля'); return; }

            database.ref('users/' + nick).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    if (snapshot.val().pass === pass) {
                        currentUser = { nick: nick, pass: pass, avatar: snapshot.val().avatar || '' };
                        localStorage.setItem('currentUser', JSON.stringify(currentUser));
                        showScreen('chats-screen');
                    } else {
                        alert('Неверный пароль');
                    }
                } else {
                    database.ref('users/' + nick).set({ pass: pass, avatar: '' });
                    currentUser = { nick: nick, pass: pass, avatar: '' };
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    showScreen('chats-screen');
                }
            });
        };

        window.logout = function() {
            currentUser = null;
            localStorage.removeItem('currentUser');
            document.getElementById('login-nick').value = '';
            document.getElementById('login-pass').value = '';
            showScreen('login-screen');
        };

        window.loadProfile = function() {
            if (!currentUser) return;
            document.getElementById('profile-nick').textContent = currentUser.nick;
            document.getElementById('new-nick').value = currentUser.nick;
            document.getElementById('avatar-img').src = currentUser.avatar || '';
        };

        window.updateProfile = function() {
            let newNick = document.getElementById('new-nick').value.trim();
            if (!newNick) return;
            if (newNick !== currentUser.nick) {
                database.ref('users/' + currentUser.nick).once('value').then(s => {
                    let data = s.val();
                    database.ref('users/' + newNick).set({ pass: data.pass, avatar: data.avatar || '' });
                    database.ref('users/' + currentUser.nick).remove();
                    currentUser.nick = newNick;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    alert('Ник изменён!');
                    loadProfile();
                });
            } else {
                alert('Ник не изменился');
            }
        };

        window.uploadAvatar = function() {
            let file = document.getElementById('avatar-file').files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = function(e) {
                let base64 = e.target.result;
                currentUser.avatar = base64;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                document.getElementById('avatar-img').src = base64;
                database.ref('users/' + currentUser.nick).update({ avatar: base64 });
            };
            reader.readAsDataURL(file);
        };

        function loadChats() {
            database.ref('chats').on('value', snapshot => {
                let list = document.getElementById('chats-list');
                list.innerHTML = '';
                if (!snapshot.exists()) {
                    list.innerHTML = '<p style="color:#888;text-align:center;padding:20px;">Нет чатов. Создай первый!</p>';
                    return;
                }
                snapshot.forEach(child => {
                    let chat = child.val();
                    let div = document.createElement('div');
                    div.classList.add('chat-item');
                    div.innerHTML = `<span class="icon">💬</span><span class="name">${chat.name}</span>`;
                    div.onclick = function() { openChat(child.key, chat.name); };
                    list.appendChild(div);
                });
            });
        }

        window.joinChat = function() {
            let name = document.getElementById('new-chat-name').value.trim();
            if (!name) return;
            let chatId = name.replace(/\s+/g, '-').toLowerCase();
            database.ref('chats/' + chatId).set({ name: name });
            document.getElementById('new-chat-name').value = '';
            openChat(chatId, name);
        };

        function openChat(chatId, chatName) {
            currentChatId = chatId;
            document.getElementById('chat-room-title').textContent = chatName;
            document.getElementById('messages').innerHTML = '';
            showScreen('chat-room-screen');
            loadRoomMessages(chatId);
        }

        function loadRoomMessages(chatId) {
            let msgDiv = document.getElementById('messages');
            msgDiv.innerHTML = '';
            database.ref('messages/' + chatId).on('child_added', function(data) {
                let msg = data.val();
                let row = document.createElement('div');
                row.classList.add('message-row');
                row.innerHTML = `
                    <img class="msg-avatar" src="${msg.avatar || ''}" alt="">
                    <div class="message">
                        <span class="sender">${msg.sender || 'Аноним'}</span><br>${msg.text}
                    </div>
                `;
                msgDiv.appendChild(row);
                msgDiv.scrollTop = msgDiv.scrollHeight;
            });
        }

        document.getElementById('send-btn').onclick = function() {
            let text = document.getElementById('msg-input').value.trim();
            if (!text || !currentUser || !currentChatId) return;
            database.ref('messages/' + currentChatId).push({
                text: text,
                sender: currentUser.nick,
                avatar: currentUser.avatar || '',
                time: Date.now()
            });
            document.getElementById('msg-input').value = '';
        };
    </script>
</body>
</html>
