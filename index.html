<!DOCTYPE html>
<html><head><title>Мессенджер | Реакции долгим нажатием</title><meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no"><style>
:root{--bg:#f0f0f0;--surface:#fff;--text:#333;--sub:#666;--primary:#0084ff;--border:#ddd;--msg-bg:#0084ff;--msg-text:#fff;--reply-bg:rgba(0,0,0,0.05);--online:#4caf50}.dark{--bg:#1a1a2e;--surface:#16213e;--text:#e0e0e0;--sub:#aaa;--primary:#1a4a7a;--border:#2a2a4a;--msg-bg:#1a4a7a;--msg-text:#e0e0e0;--reply-bg:rgba(255,255,255,0.05)}*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column}.screen{display:none;flex-direction:column;height:100vh}.screen.active{display:flex}#login-screen{justify-content:center;align-items:center;background:#0084ff}#login-screen .box{background:#fff;padding:30px;border-radius:15px;text-align:center;width:85%;max-width:350px}#login-screen h1{margin-bottom:20px;color:#333}#login-screen input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;font-size:16px}#login-screen button{width:100%;padding:12px;margin-top:10px;background:#0084ff;color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:700}.header{background:var(--primary);color:#fff;padding:15px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:17px}.header button{background:rgba(255,255,255,0.2);color:#fff;border:none;padding:8px 15px;border-radius:20px;font-size:14px}#chats-list{flex:1;overflow-y:auto}.chat-item{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer}.chat-item:active{background:var(--reply-bg)}.chat-avatar{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#007aff,#5856d6);display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px;font-weight:600;flex-shrink:0}.group-avatar{background:linear-gradient(135deg,#4caf50,#2e7d32)}.chat-info{flex:1;min-width:0}.chat-name{font-size:16px;font-weight:600}.chat-last{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#chat-actions{display:flex;padding:10px;background:var(--surface);border-top:1px solid var(--border);gap:10px;flex-wrap:wrap}#chat-actions input{flex:1;padding:12px;border:1px solid var(--border);border-radius:10px;font-size:14px;background:var(--bg);color:var(--text);min-width:120px}#chat-actions button{padding:12px 15px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-weight:700;font-size:13px;cursor:pointer}.group-buttons{display:flex;gap:8px;width:100%}.group-buttons button{flex:1;background:#4caf50}#profile-screen .content{flex:1;display:flex;flex-direction:column;align-items:center;padding:30px}#avatar-img{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#ddd;margin-bottom:15px;cursor:pointer}#profile-screen input[type="text"]{padding:10px;font-size:16px;margin:10px 0;border:1px solid var(--border);border-radius:10px;width:80%;background:var(--surface);color:var(--text)}#profile-screen button{padding:10px 20px;background:var(--primary);color:#fff;border:none;border-radius:10px;margin:5px}#avatar-file{display:none}.setting-row{display:flex;justify-content:space-between;align-items:center;width:80%;padding:15px;background:var(--surface);border-radius:10px;margin:10px 0}.toggle{width:50px;height:26px;background:#ccc;border-radius:13px;position:relative;cursor:pointer}.toggle.active{background:#34c759}.toggle::after{content:'';width:22px;height:22px;background:#fff;border-radius:50%;position:absolute;top:2px;left:2px;transition:.2s}.toggle.active::after{left:26px}#messages{flex:1;padding:10px;overflow-y:auto}.date-separator{text-align:center;font-size:11px;color:var(--sub);margin:12px 0}.date-separator span{background:var(--bg);padding:4px 12px;border-radius:20px;display:inline-block}.message-row{display:flex;gap:8px;align-items:flex-start;margin:5px 0;position:relative}.message-row .msg-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;background:#ddd;flex-shrink:0;margin-top:5px}.message{background:var(--msg-bg);color:var(--msg-text);padding:8px 12px;border-radius:18px;max-width:70%;word-wrap:break-word}.message .sender{font-size:11px;opacity:.7;margin-bottom:3px}.message .reply-preview{font-size:11px;background:var(--reply-bg);padding:4px 8px;border-radius:8px;margin-bottom:5px;border-left:3px solid rgba(255,255,255,0.4)}.message img{max-width:180px;border-radius:10px;margin-top:5px}.message .time{font-size:10px;opacity:.6;text-align:right;margin-top:3px}.message .checks{font-size:11px;margin-left:4px}.voice-msg{display:flex;align-items:center;gap:8px;padding:5px 0}.voice-msg button{background:rgba(255,255,255,0.2);border:none;color:#fff;padding:6px 12px;border-radius:20px;font-size:14px}.reactions{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}.reaction-btn{background:rgba(255,255,255,0.15);border:none;border-radius:30px;padding:3px 8px;font-size:13px;display:inline-flex;align-items:center;gap:4px;cursor:pointer;color:var(--msg-text)}.reaction-count{font-size:11px;opacity:.8}.delete-btn{position:absolute;top:5px;right:5px;background:red;color:#fff;border:none;border-radius:50%;width:20px;height:20px;font-size:12px;display:none;cursor:pointer;z-index:10}.message-row:hover .delete-btn{display:block}.reply-bar{display:flex;padding:8px 15px;background:var(--surface);border-top:1px solid var(--border);gap:10px;align-items:center}.reply-bar .reply-text{flex:1;font-size:12px;color:var(--sub)}.reply-bar button{background:none;border:none;color:red;font-size:18px}.input-area{display:flex;padding:10px;background:var(--surface);border-top:1px solid var(--border);gap:10px;align-items:center}.input-area input{flex:1;padding:12px 15px;font-size:16px;border:1px solid var(--border);border-radius:25px;outline:none;background:var(--bg);color:var(--text)}.input-area button{padding:12px 25px;font-size:16px;background:var(--primary);color:#fff;border:none;border-radius:25px;font-weight:700}.input-area .attach-btn,.input-area .mic-btn{padding:12px 15px;font-size:20px;background:none;border:none}.mic-btn.recording{color:red;animation:pulse 1s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}#photo-input{display:none}.recording-indicator{text-align:center;padding:5px;color:red;font-weight:700;display:none}.recording-indicator.active{display:block}.online-list{padding:8px 15px;font-size:12px;color:var(--sub);background:var(--surface);border-bottom:1px solid var(--border)}.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);justify-content:center;align-items:center;z-index:1000}.modal-content{background:var(--surface);border-radius:20px;padding:20px;width:85%;max-width:320px;text-align:center}.modal-content input{width:100%;padding:12px;margin:10px 0;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text)}.modal-content button{padding:10px 20px;margin:5px;border-radius:10px;border:none;background:var(--primary);color:#fff}.reaction-panel{position:fixed;bottom:100px;left:10px;right:10px;background:var(--surface);border-radius:30px;padding:12px;display:flex;justify-content:space-around;z-index:10000;box-shadow:0 4px 20px rgba(0,0,0,0.3);animation:slideUp 0.2s ease}.reaction-panel button{font-size:32px;background:none;border:none;padding:10px;cursor:pointer;transition:transform 0.1s}.reaction-panel button:active{transform:scale(1.2)}@keyframes slideUp{from{transform:translateY(100px);opacity:0}to{transform:translateY(0);opacity:1}}
</style></head><body>
<div id="login-screen" class="screen active"><div class="box"><h1>🔐 Вход</h1><input type="text" id="login-nick" placeholder="Никнейм"><input type="password" id="login-pass" placeholder="Пароль"><button id="login-btn">Войти</button></div></div>
<div id="chats-screen" class="screen"><div class="header"><span>💬 Чаты и группы</span><button id="to-profile-btn">Профиль</button></div><div id="chats-list">Загрузка...</div><div id="chat-actions"><input type="text" id="partner-input" placeholder="Ник собеседника..."><button id="start-chat-btn">Начать чат</button><div class="group-buttons"><button id="create-group-btn">➕ Создать группу</button><button id="join-group-btn">🔗 Вступить в группу</button></div></div></div>
<div id="chat-room-screen" class="screen"><div class="header"><button id="back-btn">← Назад</button><span id="chat-room-title">Чат</span><span></span></div><div class="online-list" id="online-list"></div><div id="messages"></div><div class="recording-indicator" id="rec-indicator">🎤 Запись...</div><div id="reply-bar" class="reply-bar" style="display:none"><span class="reply-text" id="reply-text"></span><button id="cancel-reply-btn">✕</button></div><div class="input-area"><button class="attach-btn" id="attach-btn">📎</button><input type="file" id="photo-input" accept="image/*"><button class="mic-btn" id="mic-btn">🎤</button><input type="text" id="msg-input" placeholder="Сообщение..."><button id="send-btn">Отпр.</button></div></div>
<div id="profile-screen" class="screen"><div class="header"><button id="profile-back-btn">← Назад</button><span>Профиль</span><button id="logout-btn">Выйти</button></div><div class="content"><img id="avatar-img" src="" alt="Аватар" onclick="document.getElementById('avatar-file').click()"><input type="file" id="avatar-file" accept="image/*"><p style="font-size:12px;color:var(--sub)">Нажми на аватар чтобы сменить</p><p id="profile-nick" style="font-weight:700;font-size:18px"></p><input type="text" id="new-nick" placeholder="Новый никнейм"><button id="save-nick-btn">Сохранить ник</button><div class="setting-row"><span>Тёмная тема</span><div class="toggle" id="theme-toggle"></div></div></div></div>
<div id="group-modal" class="modal"><div class="modal-content"><h3>Создать группу</h3><input type="text" id="group-name" placeholder="Название группы"><input type="text" id="group-invite-code" placeholder="Код для вступления"><button id="confirm-create-group">Создать</button><button id="close-modal">Отмена</button></div></div>
<div id="join-modal" class="modal"><div class="modal-content"><h3>Вступить в группу</h3><input type="text" id="join-code" placeholder="Введите код группы"><button id="confirm-join-group">Вступить</button><button id="close-join-modal">Отмена</button></div></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig={apiKey:"AIzaSyB4mdYi6d5_yWMeqf9SwRDuqMpLW7vseR8",authDomain:"website-9442c.firebaseapp.com",projectId:"website-9442c",storageBucket:"website-9442c.firebasestorage.app",messagingSenderId:"490236144166",appId:"1:490236144166:web:2651f3bc8a0a719e85d4e7"};
firebase.initializeApp(firebaseConfig);const database=firebase.database();
let currentUser=null,currentChatId=null,replyTo=null,mediaRecorder=null,audioChunks=[],recordStartTime=null,currentChatType='private';
if(localStorage.getItem('dark')==='true')document.body.classList.add('dark');
document.getElementById('theme-toggle').onclick=function(){document.body.classList.toggle('dark');localStorage.setItem('dark',document.body.classList.contains('dark'));this.classList.toggle('active',document.body.classList.contains('dark'))};
document.getElementById('theme-toggle').classList.toggle('active',document.body.classList.contains('dark'));
let savedUser=localStorage.getItem('currentUser');if(savedUser){currentUser=JSON.parse(savedUser);showScreen('chats-screen')}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');if(id==='chats-screen')loadChats();if(id==='profile-screen')loadProfile();if(id==='chat-room-screen'){updateOnlineStatus();loadOnlineUsers()}}
function updateOnlineStatus(){if(!currentUser||!currentChatId||currentChatType!=='private')return;database.ref('presence/'+currentChatId+'/'+currentUser.nick).set({online:true,lastSeen:Date.now()}).onDisconnect().set({online:false,lastSeen:Date.now()})}
function loadOnlineUsers(){if(!currentChatId||currentChatType!=='private'){document.getElementById('online-list').innerHTML='';return;}database.ref('presence/'+currentChatId).on('value',sn=>{let list=document.getElementById('online-list');list.innerHTML='';let online=[];sn.forEach(c=>{if(c.val().online&&c.key!==(currentUser?.nick||''))online.push(c.key)});list.innerHTML=online.length>0?'🟢 '+online.join(', '):'⚫ офлайн'})}
document.getElementById('login-btn').onclick=function(){let nick=document.getElementById('login-nick').value.trim(),pass=document.getElementById('login-pass').value.trim();if(!nick||!pass){alert('Заполни оба поля');return}database.ref('users/'+nick).once('value').then(s=>{if(s.exists()){if(s.val().pass===pass){currentUser={nick,pass,avatar:s.val().avatar||''};localStorage.setItem('currentUser',JSON.stringify(currentUser));showScreen('chats-screen')}else alert('Неверный пароль')}else{database.ref('users/'+nick).set({pass,avatar:''});currentUser={nick,pass,avatar:''};localStorage.setItem('currentUser',JSON.stringify(currentUser));showScreen('chats-screen')}})}
document.getElementById('logout-btn').onclick=()=>{if(currentChatId&&currentUser&&currentChatType==='private')database.ref('presence/'+currentChatId+'/'+currentUser.nick).set({online:false,lastSeen:Date.now()});currentUser=null;localStorage.removeItem('currentUser');showScreen('login-screen')}
document.getElementById('to-profile-btn').onclick=()=>showScreen('profile-screen');
document.getElementById('profile-back-btn').onclick=()=>showScreen('chats-screen');
document.getElementById('back-btn').onclick=()=>{if(currentChatId&&currentUser&&currentChatType==='private')database.ref('presence/'+currentChatId+'/'+currentUser.nick).set({online:false,lastSeen:Date.now()});currentChatId=null;showScreen('chats-screen')}
function loadProfile(){if(!currentUser)return;document.getElementById('profile-nick').textContent=currentUser.nick;document.getElementById('new-nick').value=currentUser.nick;document.getElementById('avatar-img').src=currentUser.avatar||''}
document.getElementById('save-nick-btn').onclick=function(){let nn=document.getElementById('new-nick').value.trim();if(!nn||nn===currentUser.nick)return;database.ref('users/'+currentUser.nick).once('value').then(s=>{let d=s.val();database.ref('users/'+nn).set({pass:d.pass,avatar:d.avatar||''});database.ref('users/'+currentUser.nick).remove();currentUser.nick=nn;localStorage.setItem('currentUser',JSON.stringify(currentUser));alert('Ник изменён!');loadProfile()})}
document.getElementById('avatar-file').onchange=function(){let f=this.files[0];if(!f)return;let r=new FileReader();r.onload=function(e){let b64=e.target.result;currentUser.avatar=b64;localStorage.setItem('currentUser',JSON.stringify(currentUser));document.getElementById('avatar-img').src=b64;database.ref('users/'+currentUser.nick).update({avatar:b64})};r.readAsDataURL(f)}
function getChatId(user1,user2){return [user1,user2].sort().join('_')}
function loadChats(){database.ref('chats').on('value',sn=>{let list=document.getElementById('chats-list');list.innerHTML='';if(!sn.exists()){list.innerHTML='<p style="color:var(--sub);text-align:center;padding:20px">Нет чатов</p>';return}let found=false;sn.forEach(c=>{let chat=c.val();if(chat.type==='private'&&(chat.user1===currentUser?.nick||chat.user2===currentUser?.nick)){found=true;let partner=chat.user1===currentUser.nick?chat.user2:chat.user1;let d=document.createElement('div');d.classList.add('chat-item');d.innerHTML='<div class="chat-avatar">'+partner[0].toUpperCase()+'</div><div class="chat-info"><div class="chat-name">'+partner+'</div><div class="chat-last">Личный чат</div></div>';d.onclick=()=>openPrivateChat(c.key,partner);list.appendChild(d);}
if(chat.type==='group'&&chat.members&&chat.members.includes(currentUser?.nick)){found=true;let d=document.createElement('div');d.classList.add('chat-item');d.innerHTML='<div class="chat-avatar group-avatar">👥</div><div class="chat-info"><div class="chat-name">'+ (chat.name||'Группа') +'</div><div class="chat-last">'+ (chat.members.length||0) +' участников</div></div>';d.onclick=()=>openGroupChat(c.key,chat.name||'Группа');list.appendChild(d);}});if(!found)list.innerHTML='<p style="color:var(--sub);text-align:center;padding:20px">Нет чатов. Создайте группу или начните диалог.</p>'})}
function openPrivateChat(chatId,chatName){currentChatId=chatId;currentChatType='private';document.getElementById('chat-room-title').textContent=chatName;document.getElementById('messages').innerHTML='';replyTo=null;document.getElementById('reply-bar').style.display='none';showScreen('chat-room-screen');loadRoomMessages(chatId);}
function openGroupChat(chatId,groupName){currentChatId=chatId;currentChatType='group';document.getElementById('chat-room-title').textContent=groupName;document.getElementById('online-list').innerHTML='👥 Групповой чат';document.getElementById('messages').innerHTML='';replyTo=null;document.getElementById('reply-bar').style.display='none';showScreen('chat-room-screen');loadRoomMessages(chatId);}
document.getElementById('start-chat-btn').onclick=function(){let partner=document.getElementById('partner-input').value.trim();if(!partner){alert('Введите ник');return}if(partner===currentUser.nick){alert('Нельзя чат с собой');return}database.ref('users/'+partner).once('value').then(s=>{if(s.exists()){let chatId=getChatId(currentUser.nick,partner);database.ref('chats/'+chatId).set({type:'private',user1:currentUser.nick,user2:partner,created:Date.now()});document.getElementById('partner-input').value='';openPrivateChat(chatId,partner)}else{alert('Пользователь не найден')}})}
document.getElementById('create-group-btn').onclick=()=>document.getElementById('group-modal').style.display='flex';
document.getElementById('join-group-btn').onclick=()=>document.getElementById('join-modal').style.display='flex';
document.getElementById('close-modal').onclick=()=>document.getElementById('group-modal').style.display='none';
document.getElementById('close-join-modal').onclick=()=>document.getElementById('join-modal').style.display='none';
document.getElementById('confirm-create-group').onclick=()=>{let groupName=document.getElementById('group-name').value.trim(),inviteCode=document.getElementById('group-invite-code').value.trim();if(!groupName||!inviteCode){alert('Название и код обязательны');return;}let groupId='group_'+Date.now()+'_'+Math.random().toString(36).substr(2,6);database.ref('chats/'+groupId).set({type:'group',name:groupName,owner:currentUser.nick,members:[currentUser.nick],inviteCode:inviteCode,created:Date.now()}).then(()=>{alert('Группа создана! Код: '+inviteCode);document.getElementById('group-modal').style.display='none';document.getElementById('group-name').value='';document.getElementById('group-invite-code').value='';loadChats();})}
document.getElementById('confirm-join-group').onclick=()=>{let code=document.getElementById('join-code').value.trim();if(!code){alert('Введите код группы');return;}database.ref('chats').orderByChild('inviteCode').equalTo(code).once('value').then(sn=>{if(sn.exists()){let groupRef=null;sn.forEach(child=>groupRef={id:child.key,data:child.val()});if(groupRef&&groupRef.data.type==='group'){let members=groupRef.data.members||[];if(!members.includes(currentUser.nick)){members.push(currentUser.nick);database.ref('chats/'+groupRef.id).update({members:members}).then(()=>{alert('Вы вступили в группу!');document.getElementById('join-modal').style.display='none';document.getElementById('join-code').value='';loadChats();})}else{alert('Вы уже в этой группе');document.getElementById('join-modal').style.display='none';}}else{alert('Неверный код');}}else{alert('Группа с таким кодом не найдена');}});}
function addReaction(msgId,reactionType){if(!currentUser)return;let reactRef=database.ref('messages/'+currentChatId+'/'+msgId+'/reactions/'+reactionType);reactRef.transaction(current=>{let users=current||[];if(!users.includes(currentUser.nick)){users.push(currentUser.nick);}else{users=users.filter(u=>u!==currentUser.nick);}return users.length?users:null;});}
function formatDateHeader(timestamp){let d=new Date(timestamp),today=new Date(),yesterday=new Date(today);yesterday.setDate(yesterday.getDate()-1);if(d.toDateString()===today.toDateString())return 'Сегодня';if(d.toDateString()===yesterday.toDateString())return 'Вчера';return d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}
function formatTime(ts){let d=new Date(ts);return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0')}
function showReactionPanel(msgId){let existing=document.querySelector('.reaction-panel');if(existing)existing.remove();let panel=document.createElement('div');panel.className='reaction-panel';panel.innerHTML=`<button data-reaction="❤️">❤️</button><button data-reaction="👍">👍</button><button data-reaction="😂">😂</button><button data-reaction="😮">😮</button><button data-reaction="😢">😢</button><button data-reaction="🔥">🔥</button>`;panel.querySelectorAll('button').forEach(btn=>{btn.onclick=(e)=>{e.stopPropagation();addReaction(msgId,btn.dataset.reaction);panel.remove();}});document.body.appendChild(panel);setTimeout(()=>panel.remove(),4000);let closeHandler=(e)=>{if(!panel.contains(e.target))panel.remove();document.removeEventListener('click',closeHandler);};setTimeout(()=>document.addEventListener('click',closeHandler),50);}
function loadRoomMessages(chatId){let msgDiv=document.getElementById('messages');msgDiv.innerHTML='';let lastDate=null;database.ref('messages/'+chatId).off();database.ref('messages/'+chatId).orderByChild('time').on('child_added',snap=>{let msg=snap.val(),msgDate=formatDateHeader(msg.time||Date.now());if(msgDate!==lastDate){let sep=document.createElement('div');sep.className='date-separator';sep.innerHTML='<span>'+msgDate+'</span>';msgDiv.appendChild(sep);lastDate=msgDate;}displayMessage(snap.key,msg,msgDiv);});}
function displayMessage(key,msg,container){let row=document.createElement('div');row.classList.add('message-row');row.setAttribute('data-id',key);let isMine=currentUser&&msg.sender===currentUser.nick,reactionsHtml='';if(msg.reactions){for(let[emoji,users]of Object.entries(msg.reactions)){if(users&&users.length){let hasReacted=users.includes(currentUser.nick);reactionsHtml+=`<button class="reaction-btn" onclick="event.stopPropagation();addReaction('${key}','${emoji}')"><span>${emoji}</span><span class="reaction-count">${users.length}</span></button>`;}}}let html='<img class="msg-avatar" src="'+(msg.avatar||'')+'" alt="" onerror="this.src=\'\'"><div class="message">';if(msg.replyTo)html+='<div class="reply-preview">↪ '+(msg.replySender||'')+': '+(msg.replyText||'')+'</div>';html+='<span class="sender">'+(msg.sender||'Аноним')+'</span><br>';if(msg.voice)html+='<div class="voice-msg"><button onclick="event.stopPropagation();playVoice(\''+msg.voice+'\')">▶️</button><span class="duration">'+(msg.duration||'?')+'с</span></div>';else html+=(msg.text||'');if(msg.photo)html+='<br><img src="'+msg.photo+'" onclick="event.stopPropagation();openImage(\''+msg.photo+'\')">';if(reactionsHtml)html+='<div class="reactions">'+reactionsHtml+'</div>';html+='<div class="time">'+formatTime(msg.time||Date.now());if(isMine&&currentChatType==='private')html+='<span class="checks">'+(msg.read?'✅✅':'✅')+'</span>';html+='</div></div>';if(isMine)html+='<button class="delete-btn" onclick="event.stopPropagation();deleteMsg(\''+key+'\')">✕</button>';row.innerHTML=html;
row.onclick=function(e){if(e.target.closest('.reaction-btn')||e.target.closest('.delete-btn'))return;replyTo={id:key,text:msg.text||(msg.voice?'Голосовое':'Фото'),sender:msg.sender};document.getElementById('reply-text').textContent='↩ '+msg.sender+': '+(msg.text||(msg.voice?'Голосовое':'Фото'));document.getElementById('reply-bar').style.display='flex';if(!isMine&&!msg.read&&currentChatType==='private')database.ref('messages/'+currentChatId+'/'+key).update({read:true});};
let pressTimer;row.ontouchstart=function(e){pressTimer=setTimeout(()=>{showReactionPanel(key);},500);};row.ontouchend=function(){clearTimeout(pressTimer);};row.ontouchmove=function(){clearTimeout(pressTimer);};row.oncontextmenu=function(e){e.preventDefault();showReactionPanel(key);return false;};
container.appendChild(row);container.scrollTop=container.scrollHeight;}
window.deleteMsg=function(key){if(!confirm('Удалить?'))return;database.ref('messages/'+currentChatId+'/'+key).remove();document.querySelector('[data-id="'+key+'"]')?.remove()}
window.playVoice=function(b64){new Audio(b64).play()}
window.openImage=function(s){let w=window.open('','_blank');w.document.write('<img src="'+s+'" style="max-width:100%">')}
document.getElementById('cancel-reply-btn').onclick=()=>{replyTo=null;document.getElementById('reply-bar').style.display='none'}
document.getElementById('attach-btn').onclick=()=>document.getElementById('photo-input').click()
document.getElementById('photo-input').onchange=function(){let f=this.files[0];if(!f)return;let r=new FileReader();r.onload=function(e){let md={photo:e.target.result,text:'',sender:currentUser.nick,avatar:currentUser.avatar||'',time:Date.now(),read:false};if(replyTo){md.replyTo=replyTo.id;md.replyText='Фото';md.replySender=replyTo.sender;replyTo=null;document.getElementById('reply-bar').style.display='none'}database.ref('messages/'+currentChatId).push(md)};r.readAsDataURL(f);this.value=''}
document.getElementById('mic-btn').onmousedown=function(){if(!navigator.mediaDevices)return;navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{mediaRecorder=new MediaRecorder(stream);audioChunks=[];recordStartTime=Date.now();document.getElementById('rec-indicator').classList.add('active');document.getElementById('mic-btn').classList.add('recording');mediaRecorder.ondataavailable=e=>audioChunks.push(e.data);mediaRecorder.onstop=function(){document.getElementById('rec-indicator').classList.remove('active');document.getElementById('mic-btn').classList.remove('recording');let blob=new Blob(audioChunks,{type:'audio/webm'});let r=new FileReader();r.onload=function(e){let md={voice:e.target.result,duration:Math.round((Date.now()-recordStartTime)/1000),text:'',sender:currentUser.nick,avatar:currentUser.avatar||'',time:Date.now(),read:false};if(replyTo){md.replyTo=replyTo.id;md.replyText='Голосовое';md.replySender=replyTo.sender;replyTo=null;document.getElementById('reply-bar').style.display='none'}database.ref('messages/'+currentChatId).push(md)};r.readAsDataURL(blob)};mediaRecorder.start()})}
document.getElementById('mic-btn').onmouseup=()=>{if(mediaRecorder?.state==='recording')mediaRecorder.stop()}
document.getElementById('mic-btn').ontouchstart=document.getElementById('mic-btn').onmousedown
document.getElementById('mic-btn').ontouchend=document.getElementById('mic-btn').onmouseup
document.getElementById('send-btn').onclick=function(){let text=document.getElementById('msg-input').value.trim();if(!text||!currentUser||!currentChatId)return;let md={text,sender:currentUser.nick,avatar:currentUser.avatar||'',time:Date.now(),read:false};if(replyTo){md.replyTo=replyTo.id;md.replyText=replyTo.text;md.replySender=replyTo.sender;replyTo=null;document.getElementById('reply-bar').style.display='none'}database.ref('messages/'+currentChatId).push(md);document.getElementById('msg-input').value=''}
</script></body></html>
