<script type="module">
import{initializeApp}from'firebase/app';
import{getDatabase,ref,push,onChildAdded,query,limitToLast,set,onDisconnect,onValue,get,remove}from'firebase/database';

const firebaseConfig={apiKey:"AIzaSyAu_0afyO3C0imzjUPL4JXK17TWl9-y1K0",authDomain:"messenger-1b3dd.firebaseapp.com",projectId:"messenger-1b3dd",storageBucket:"messenger-1b3dd.firebasestorage.app",messagingSenderId:"1036753745497",appId:"1:1036753745497:web:85b9426307a4dfa3b8a348",databaseURL:"https://messenger-1b3dd-default-rtdb.firebaseio.com/"};
const app=initializeApp(firebaseConfig);
const database=getDatabase(app);

let currentUser=null,chatsData={},unreadCounts={},currentReplyTo=null,currentOpenChat=null,onlineStatuses={},activityInterval=null,messagesListeners={},pressTimers=new Map();
let ADMINS=['Чупик','чокопай'];
const OFFICIAL_CHANNEL='⭐ Официальный канал';

function isAdmin(){return ADMINS.includes(currentUser);}
function getChatRoomName(a,b){return[a,b].sort().join('___');}
function formatMessageTime(){const n=new Date();return`${n.getHours().toString().padStart(2,'0')}:${n.getMinutes().toString().padStart(2,'0')}`;}
function getUserBio(u){return localStorage.getItem('bio_'+u)||'';}
function saveUserBio(u,b){if(b&&b.trim())localStorage.setItem('bio_'+u,b.trim());else localStorage.removeItem('bio_'+u);}
function saveUserAvatar(u,a){localStorage.setItem('avatar_'+u,a);if(currentUser===u){const m=document.getElementById('menuAvatar');if(a&&a.startsWith('data:image')){m.style.backgroundImage=`url(${a})`;m.style.backgroundSize='cover';m.textContent='';}else{m.style.backgroundImage='';m.textContent=a||'👤';}}}
function getUserAvatar(u){return localStorage.getItem('avatar_'+u)||'👤';}
function showFullAvatar(u){const a=getUserAvatar(u),i=a&&a.startsWith('data:image'),d=document.createElement('div');d.className='avatar-fullscreen';d.innerHTML=`<div class="avatar-fullscreen-img" style="${i?`background-image:url(${a});background-size:cover;background-position:center` : ''}">${i?'':a}</div><button class="avatar-fullscreen-close">✕ Закрыть</button>`;document.body.appendChild(d);d.querySelector('.avatar-fullscreen-close').onclick=()=>d.remove();d.onclick=e=>{if(e.target===d)d.remove();};}
function isUserOnline(u){const s=onlineStatuses[u];return s?(Date.now()-s)<60000:false;}
async function updateOnlineStatus(){if(currentUser){const n=Date.now();await set(ref(database,`users/${currentUser}/online`),n);await set(ref(database,`users/${currentUser}/lastSeen`),n);onDisconnect(ref(database,`users/${currentUser}/online`)).set(null);}}
function trackActivity(){if(activityInterval)clearInterval(activityInterval);activityInterval=setInterval(()=>{if(currentUser)set(ref(database,`users/${currentUser}/online`),Date.now());},30000);['click','touchstart','keydown','scroll'].forEach(e=>{document.addEventListener(e,()=>{if(currentUser)set(ref(database,`users/${currentUser}/online`),Date.now());});});}
function formatLastSeen(t){if(!t)return'❓ Неизвестно';const diff=Date.now()-t;const min=Math.floor(diff/60000),hour=Math.floor(diff/3600000),day=Math.floor(diff/86400000);if(diff<60000)return'только что';if(min<60)return`${min} мин назад`;if(hour<24)return`${hour} ч назад`;return`${day} д назад`;}
async function getLastSeen(u){const s=await get(ref(database,`users/${u}/lastSeen`));return s.val()||null;}
async function loadAllUsers(){const snap=await get(ref(database,'users'));const data=snap.val()||{};return Object.keys(data);}
async function initOfficialChannel(){const ch=await get(ref(database,'official_channel'));if(!ch.exists())await set(ref(database,'official_channel'),{created:Date.now()});}
async function loadAdmins(){const a=await get(ref(database,'admins'));if(a.exists())ADMINS=a.val();else await set(ref(database,'admins'),ADMINS);}

function loadUserData(){
    document.getElementById('menuNickname').textContent=currentUser||'';
    const b=getUserBio(currentUser),bd=document.getElementById('menuBio');
    if(b&&b.trim()){bd.textContent=b.length>60?b.substring(0,60)+'...':b;bd.style.display='block';}else bd.style.display='none';
    const a=getUserAvatar(currentUser),ma=document.getElementById('menuAvatar');
    if(a&&a.startsWith('data:image')){ma.style.backgroundImage=`url(${a})`;ma.style.backgroundSize='cover';ma.textContent='';}else{ma.style.backgroundImage='';ma.textContent=a||'👤';}
    document.getElementById('menuAvatar').onclick=()=>showFullAvatar(currentUser);
    document.getElementById('adminPanelBtn').style.display=isAdmin()?'flex':'none';
}

function renderChatsList(){
    const c=document.getElementById('chatsList');
    if(!c)return;
    c.innerHTML='';
    const uc=[{with:OFFICIAL_CHANNEL,roomName:'official_channel'}];
    for(const rn in chatsData){
        if(rn&&rn.includes(currentUser)){
            const o=rn.split('___').find(n=>n!==currentUser);
            if(o)uc.push({with:o,roomName:rn});
        }
    }
    for(const ch of uc){
        const d=document.createElement('div');
        d.className='chat-item';
        const a=getUserAvatar(ch.with),isImg=a&&a.startsWith('data:image'),isOn=ch.with!==OFFICIAL_CHANNEL&&isUserOnline(ch.with),un=unreadCounts[ch.roomName]||0;
        d.innerHTML=`<div class="chat-avatar" style="${ch.with===OFFICIAL_CHANNEL?'background:linear-gradient(135deg,#e94560,#ff6b8b);display:flex;align-items:center;justify-content:center;font-size:24px':(isImg?`background-image:url(${a});background-size:cover;background-position:center`:'background:rgba(255,255,255,0.1);display:flex;align-items:center;justify-content:center')}">${ch.with===OFFICIAL_CHANNEL?'⭐':(isImg?'':a)}</div><div class="chat-info"><div class="chat-name">${ch.with}${un>0?`<span class="unread-badge">${un>99?'99+':un}</span>`:''}</div><div class="chat-status ${isOn?'online':'offline'}">${ch.with===OFFICIAL_CHANNEL?'📢 Официальный канал':(isOn?'🟢 Онлайн':'⚫ Офлайн')}</div></div>${ch.with!==OFFICIAL_CHANNEL?'<button class="delete-chat">🗑</button>':''}`;
        if(ch.with!==OFFICIAL_CHANNEL){
            const av=d.querySelector('.chat-avatar');
            if(av)av.onclick=(e)=>{e.stopPropagation();showFullAvatar(ch.with);};
            d.querySelector('.chat-info').onclick=()=>openChat(ch.with);
            d.querySelector('.delete-chat').onclick=async(e)=>{e.stopPropagation();if(confirm(`Удалить чат с ${ch.with}?`)){await set(ref(database,`chats/${ch.roomName}`),null);delete chatsData[ch.roomName];localStorage.setItem('chats',JSON.stringify(chatsData));renderChatsList();}};
        }else{
            d.querySelector('.chat-info').onclick=()=>openOfficialChannel();
        }
        c.appendChild(d);
    }
}

function openOfficialChannel(){
    currentOpenChat=OFFICIAL_CHANNEL;
    document.getElementById('chatWith').textContent=OFFICIAL_CHANNEL;
    renderOfficialMessages();
    document.getElementById('chatsScreen').style.display='none';
    document.getElementById('messengerScreen').style.display='flex';
    document.getElementById('inputWrapper').style.display=isAdmin()?'block':'none';
    document.getElementById('chatHeaderStatus').textContent='📢 Официальный канал';
    document.getElementById('chatHeaderStatus').className='chat-header-status';
    document.getElementById('chatWith').onclick=()=>showChannelMembers();
}

async function showChannelMembers(){
    const modal=document.createElement('div');
    modal.className='modal';
    modal.innerHTML=`<div class="modal-content"><h3>👥 Участники канала</h3><div id="membersList" style="max-height:300px;overflow-y:auto"></div><div class="modal-buttons"><button id="closeMembersModal" class="secondary-btn">Закрыть</button></div></div>`;
    document.body.appendChild(modal);
    const listDiv=document.getElementById('membersList');
    async function renderMembers(){
        const users=await loadAllUsers();
        listDiv.innerHTML='';
        for(const u of users){
            const item=document.createElement('div');
            item.style.cssText='display:flex;justify-content:space-between;align-items:center;padding:10px;margin:5px 0;background:rgba(255,255,255,0.05);border-radius:15px';
            item.innerHTML=`<span style="color:#fff">${u} ${ADMINS.includes(u)?'👑':''}</span>`;
            if(isAdmin() && u!==currentUser){
                const btnAdd=document.createElement('button');
                btnAdd.textContent='👑 +Админ';
                btnAdd.style.cssText='background:rgba(10,124,255,0.3);border:none;padding:5px 10px;border-radius:15px;color:#fff;margin-left:10px';
                btnAdd.onclick=async()=>{
                    if(!ADMINS.includes(u)){
                        ADMINS.push(u);
                        await set(ref(database,'admins'),ADMINS);
                        alert(`${u} теперь админ!`);
                        renderMembers();
                        if(currentUser===u)loadUserData();
                    }
                };
                const btnRemove=document.createElement('button');
                btnRemove.textContent='➖ -Админ';
                btnRemove.style.cssText='background:rgba(233,69,96,0.3);border:none;padding:5px 10px;border-radius:15px;color:#fff;margin-left:5px';
                btnRemove.onclick=async()=>{
                    if(ADMINS.includes(u) && u!=='Чупик' && u!=='чокопай'){
                        const idx=ADMINS.indexOf(u);
                        if(idx!==-1)ADMINS.splice(idx,1);
                        await set(ref(database,'admins'),ADMINS);

async function showAdminPanel(){

                if(confirm(`Удалить аккаунт ${u}? Все его чаты и сообщения будут удалены!`)){

                    await remove(ref(database,`passwords/${u}`));

    document.getElementById('closeAdminModalBtn').onclick=()=>modal.remove();

function attachContextMenuToMessage(w,key,sender,text,isMine,room){if(pressTimers.has(w)){clearTimeout(pressTimers.get(w));pressTimers.delete(w);}let timer;const start=(e)=>{timer=setTimeout(()=>{showContextMenu(e.touches[0].clientX,e.touches[0].clientY,key,sender,text,isMine,w,room);},500);pressTimers.set(w,timer);};const clear=()=>{if(timer)clearTimeout(timer);pressTimers.delete(w);};w.addEventListener('touchstart',start);w.addEventListener('touchend',clear);w.addEventListener('touchmove',clear);}
function showContextMenu(x,y,key,sender,text,isMine,wrapper,room){const ex=document.querySelector('.context-menu');if(ex)ex.remove();const menu=document.createElement('div');menu.className='context-menu';const rect=wrapper.getBoundingClientRect(),sw=window.innerWidth;if(isMine){let lp=rect.left-150;if(lp<10)lp=rect.left+10;menu.style.left=lp+'px';menu.style.top=(rect.top+20)+'px';}else{let rp=sw-rect.right+10;if(rp<10)rp=sw-rect.left-160;menu.style.right=rp+'px';menu.style.top=(rect.top+20)+'px';}const reply=document.createElement('div');reply.className='context-menu-item';reply.innerHTML='💬 Ответить';reply.onclick=()=>{currentReplyTo={sender,text};document.getElementById('replyPreview').style.display='flex';document.getElementById('replyToText').textContent=`${sender}: ${text?text.substring(0,40):''}...`;menu.remove();};menu.appendChild(reply);if(isMine){const del=document.createElement('div');del.className='context-menu-item context-menu-delete';del.innerHTML='🗑 Удалить';del.onclick=async()=>{if(confirm('Удалить сообщение?')){await remove(ref(database,`chats/${room}/messages/${key}`));}};menu.appendChild(del);}document.body.appendChild(menu);setTimeout(()=>{const ch=(e)=>{if(!menu.contains(e.target)){menu.remove();document.removeEventListener('click',ch);}};document.addEventListener('click',ch);},10);}

function showAccountModal(){const m=document.createElement('div');m.className='modal';const a=getUserAvatar(currentUser),isImg=a&&a.startsWith('data:image');m.innerHTML=`<div class="modal-content"><h3>👤 Мой профиль</h3><div class="avatar-preview" id="accAvatar" style="${isImg?`background-image:url(${a});background-size:cover;background-position:center;font-size:0`:''}">${isImg?'':a}</div><div class="avatar-select"><div class="avatar-option" data-avatar="👤">👤</div><div class="avatar-option" data-avatar="😀">😀</div><div class="avatar-option" data-avatar="😎">😎</div><div class="avatar-option" data-avatar="🥷">🥷</div><div class="avatar-option" data-avatar="🐱">🐱</div><div class="avatar-option" data-avatar="⭐">⭐</div><div class="avatar-option upload-avatar" id="upAvBtn">📷</div></div><p style="color:white;text-align:center;margin:10px 0">${currentUser}</p><textarea id="bioInp" placeholder="О себе..." rows="2" maxlength="200">${getUserBio(currentUser)}</textarea><div class="modal-buttons"><button id="saveBio">Сохранить</button><button id="closeAcc" class="secondary-btn">Закрыть</button></div></div>`;document.body.appendChild(m);document.querySelectorAll('.avatar-option:not(#upAvBtn)').forEach(opt=>{opt.onclick=()=>{saveUserAvatar(currentUser,opt.dataset.avatar);const pr=document.getElementById('accAvatar');pr.style.backgroundImage='';pr.style.fontSize='32px';pr.textContent=opt.dataset.avatar;};});document.getElementById('upAvBtn').onclick=()=>{const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=e=>{const f=e.target.files[0];if(f){const r=new FileReader();r.onload=ev=>{const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=c.height=200;c.getContext('2d').drawImage(img,0,0,200,200);const url=c.toDataURL('image/jpeg',0.8);saveUserAvatar(currentUser,url);const pr=document.getElementById('accAvatar');pr.style.backgroundImage=`url(${url})`;pr.style.backgroundSize='cover';pr.textContent='';};img.src=ev.target.res function showSettingsModal(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modal-content"><h3>⚙️ Настройки</h3><input id="newNick" placeholder="Новый ник" value="${currentUser}"><input id="newPass" placeholder="Новый пароль" type="password"><input id="confPass" placeholder="Подтвердить пароль" type="password"><div class="modal-buttons"><button id="saveSet">Сохранить</button><button id="closeSet" class="secondary-btn">Отмена</button></div></div>`;document.body.appendChild(m);document.getElementById('saveSet').onclick=async()=>{const nn=document.getElementById('newNick').value.trim(),np=document.getElementById('newPass').value,cp=document.getElementById('confPass').value;if(!nn){alert("Ник не может быть пустым");return;}if(np!==cp){alert("Пароли не совпадают");return;}if(nn!==currentUser){const ex=await get(ref(database,`users/${nn}/nick`));if(ex.exists()){alert("Ник уже занят");return;}const ud=await get(ref(database,`users/${currentUser}`)),data=ud.val();await set(ref(database,`users/${nn}`),{nick:nn,avatar:data.avatar||'👤',registered:data.registered});const pd=await get(ref(database,`passwords/${currentUser}`));await set(ref(database,`passwords/${nn}`),pd.val());await set(ref(database,`users/${currentUser}`),null);await set(ref(database,`passwords/${currentUser}`),null);const oa=getUserAvatar(currentUser);if(oa)saveUserAvatar(nn,oa);const ob=getUserBio(currentUser);if(ob)saveUserBio(nn,ob);const nc={};for(const r in chatsData){if(r&&r.includes(currentUser))nc[r.replace(currentUser,nn)]=chatsData[r];else if(r)nc[r]=chatsData[r];}chatsData=nc;localStorage.setItem('chats',JSON.stringify(chatsData));for(const or in chatsData){if(or&&or.includes(currentUser)){const nr=or.replace(currentUser,nn),rd=await get(ref(database,`chats/${or}`));if(rd.exists()){await set(ref(database,`chats/${nr}`),rd.val());await set(ref(database,`chats/${or}`),null);}}}currentUser=nn;localStorage.setItem('currentUser',currentUser);if(ADMINS.includes(currentU
