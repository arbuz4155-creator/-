<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>I love you ❤️</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', serif;
      overflow: hidden;
    }

    .container {
      width: 100%;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      position: relative;
    }

    .heart-wrapper {
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .heart-text {
      position: absolute;
      font-weight: bold;
      color: #8B0000;
      font-family: 'Georgia', serif;
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.4s ease;
      user-select: none;
      text-align: center;
      line-height: 1;
      letter-spacing: 0.5px;
      pointer-events: none;
    }

    .heart-wrapper.show .heart-text {
      opacity: 1;
    }

    @media (max-width: 400px) {
      .heart-text {
        font-size: 5px !important;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="heart-wrapper" id="heartWrapper"></div>
  </div>

  <script>
    (function() {
      const wrapper = document.getElementById('heartWrapper');

      // Функция проверки, попадает ли точка в сердце (формула сердца)
      function isInHeart(x, y) {
        const x2 = x * x;
        const y2 = y * y;
        const val = Math.pow(x2 + y2 - 1, 3) - x2 * y * y * y;
        return val <= 0;
      }

      // Генерируем точки внутри сердца
      function generateHeartPoints(count) {
        const points = [];
        let attempts = 0;
        let placed = 0;
        
        while (placed < count && attempts < 200000) {
          attempts++;
          const x = (Math.random() - 0.5) * 2.4;
          const y = (Math.random() - 0.5) * 2.4;
          
          if (isInHeart(x, y)) {
            points.push({
              x: x + (Math.random() - 0.5) * 0.04,
              y: y + (Math.random() - 0.5) * 0.04,
              size: 4 + Math.random() * 6, // 4-10px
              rotate: (Math.random() - 0.5) * 20,
              delay: 0.5 + Math.random() * 3.5,
              red: 80 + Math.random() * 100,
              scale: 0.7 + Math.random() * 0.6
            });
            placed++;
          }
        }
        return points;
      }

      // Создаём 400 фраз (можно увеличить до 500)
      const points = generateHeartPoints(420);

      points.forEach(point => {
        const el = document.createElement('div');
        el.className = 'heart-text';
        el.textContent = 'I love you';
        
        // Инвертируем Y, чтобы сердце стояло правильно (остриём вниз)
        const left = ((point.x / 1.2) * 50 + 50);
        const top = ((-point.y / 1.2) * 50 + 50);  // <- инверсия Y
        
        el.style.left = left + '%';
        el.style.top = top + '%';
        el.style.transform = `translate(-50%, -50%) rotate(${point.rotate}deg) scale(${point.scale})`;
        el.style.fontSize = point.size + 'px';
        el.style.transitionDelay = point.delay + 's';
        
        el.style.color = `rgb(${point.red}, 0, 0)`;
        el.style.textShadow = `0 0 ${5 + Math.random() * 15}px rgba(${point.red}, 0, 0, 0.4)`;
        
        wrapper.appendChild(el);
      });

      // Запускаем появление через 0.5 секунды
      setTimeout(() => {
        wrapper.classList.add('show');
      }, 500);
    })();
  </script>
</body>
</html>
